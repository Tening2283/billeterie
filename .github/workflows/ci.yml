name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Utilisés à partir des étapes 1 (PostgreSQL) et 3 (Redis) pour les tests d'intégration.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: billetterie
          POSTGRES_PASSWORD: billetterie
          POSTGRES_DB: billetterie_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U billetterie"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://billetterie:billetterie@localhost:5432/billetterie_test
      DIRECT_URL: postgresql://billetterie:billetterie@localhost:5432/billetterie_test
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: 'test:'
      # Secret de test uniquement, sans valeur en dehors de la CI.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      TICKET_SECRET: ci-only-ticket-secret-not-used-anywhere-else-987
      BCRYPT_COST: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Migrations
        run: npm run db:deploy -w @billetterie/api

      - name: Tests et couverture (seuil 80 %)
        run: npm run test:coverage

      - name: Build
        run: npm run build
